version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: zoro-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zoro_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zoro_prod}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: zoro-redis-prod
    volumes:
      - redis_data_prod:/data
    restart: always

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: zoro-api-prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: zoro-web-prod
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always

volumes:
  postgres_data_prod:
  redis_data_prod:
